# 在此可修改可用GUI界面。
#
# 全局标题变量：
# %villager-name%：村民名称（若涉及特定村民）。
# %page%：当前页码（仅适用于@combat/whistle.title）。
# %max-page%：总页数（仅适用于@combat/whistle.title）。
# %sex%：生成皮肤的性别（仅适用于@skins/new-skin.title）。
# %age-stage%：生成皮肤的年龄阶段（仅适用于@skins/new-skin.title）。
#
# 注意：对于“main”物品栏，可通过以下格式选择物品位置：slot: x, y；从左上角开始，1, 1为起始坐标。
# 若觉得困难，可直接指定物品栏槽位，参考https://wiki.vg/Inventory#Large_chest。
# 例如：6x9的箱子，想将物品放在x=1, y=6，需使用：slot: 45。
#
# 所有有效槽位：https://filoghost.me/data/chest-commands/coordinates-table.png（感谢@filoghost）
