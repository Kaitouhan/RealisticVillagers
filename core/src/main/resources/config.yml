# * 希望所有村民收到ARROW时获得2声望（'good'类别）。
# * 只需在列表中添加ARROW。
# * 希望FLETCHER村民收到ARROW时获得3声望（'better'类别）。
# * 使用以下格式添加条件：?{PROFESSION}:{MATERIAL/TAG（必须以$开头）}
# * 此例中：?FLETCHER:ARROW
#
# 本插件提供以下额外标签：
# * LEATHER_ARMOR_PIECES,
# * IRON_ARMOR_PIECES
# * CHAINMAIL_ARMOR_PIECES
# * GOLDEN_ARMOR_PIECES
# * DIAMOND_ARMOR_PIECES
# * NETHERITE_ARMOR_PIECES
# * ARMOR_PIECES（包含以上所有）
# * WOODEN_TOOLS
# * STONE_TOOLS
# * IRON_TOOLS
# * GOLDEN_TOOLS
# * DIAMOND_TOOLS
# * NETHERITE_TOOLS
# * TOOLS（包含以上所有）
# * EDIBLES
# * RECORDS
# * POTIONS
#
# 材质列表见https://minecraft.fandom.com/wiki/Material
gift:
  good:
    reputation: 2
    items:
      - GOLDEN_APPLE
      - $EDIBLES
      - $FLOWERS
      - $RECORDS
      - $LEATHER_ARMOR_PIECES
      - $CHAINMAIL_ARMOR_PIECES
      - $GOLDEN_ARMOR_PIECES
      - $WOODEN_TOOLS
      - $STONE_TOOLS
      - $GOLDEN_TOOLS
      - AMETHYST_SHARD
      - $ARROWS
      - BONE
  better:
    reputation: 3
    items:
      - $POTIONS
      - $IRON_ARMOR_PIECES
      - $IRON_TOOLS
      - SHIELD
      - ENDER_PEARL
      - BOW
      - CROSSBOW
      - ?FLETCHER:$ARROWS
      - ?FISHERMAN:FISHING_ROD
  best:
    reputation: 5
    items:
      - $BEACON_PAYMENT_ITEMS
      - $DIAMOND_ARMOR_PIECES
      - $NETHERITE_ARMOR_PIECES
      - $DIAMOND_TOOLS
      - $NETHERITE_TOOLS
      - ENCHANTED_GOLDEN_APPLE
      - TRIDENT

# 再次钓鱼的冷却时间（刻）。
fishing-cooldown: 600

# 村民近战攻击伤害值。
attack-damage: 3.0

# 远程武器（弓/弩）的威力。
# 注意：不了解请不要修改。
range-weapon-power: 1.6

# 是否使用普通村民而非玩家外观（不推荐，阅读下方说明）。
# 注意：若为true，请注意...
# * 由于Minecraft限制，渔夫无法钓鱼（需玩家手持钓竿）。
# * 村民可穿戴盔甲和使用副手物品，但不会渲染。
# * 本插件目标是让村民尽可能像玩家，此选项为可选。
disable-skins: false

# 在此可选择村民以玩家外观显示并可互动的世界。
# 若type为BLACKLIST，列出的世界将禁用。
# 若type为WHITELIST，仅列出的世界启用。
# 注意：修改后必须重启服务器生效。
worlds-filter:
  type: BLACKLIST
  worlds:
    - world_name_1
    - world_name_2
    - world_name_3

# 再次尝试驯服的冷却时间（刻）。0或更小表示无限制。
tame-cooldown: 600

# 在此可选择村民想要的物品。
# 若物品在附近，或在箱子中且允许村民掠夺（@loot-chest.enabled = true），村民会去拾取。
# 若希望特定材质/标签仅从箱子中拾取，需在材质末尾加"*"。
# 示例：IRON_INGOT*
#
# 也可指定掠夺时从物品栏拾取的数量；未指定则仅拾取1个。
# （需在材质/标签末尾括号内指定，若使用*则加在括号后）。
# 示例：IRON_INGOT(2)*
#
# 采用与礼物相同的系统，可添加材质、标签和职业条件；详见@gift。
# 注意：在村民附近死亡时，他们会拾取任何想要的物品。
default-wanted-items:
  - BREAD
  - POTATO
  - CARROT
  - WHEAT
  - WHEAT_SEEDS
  - BEETROOT
  - BEETROOT_SEEDS
  - TORCHFLOWER_SEEDS
  - PITCHER_POD
  - MELON_SEEDS
  - PUMPKIN_SEEDS
  - ?FARMER:BONE_MEAL
  - BONE(1)*
  - COD(2)*
  - SALMON($RANDOM)*
  - IRON_INGOT(2-6)*

# 近战攻击时跳跃的概率（仅为增加“真实感”）。
# 注意：建议设为0.0以免跳跃时被攻击（或使用较低值）。
melee-attack-jump-chance: 0.0

# 远程攻击（弓/弩）时后退并跳跃的概率（仅为增加“真实感”）。
# 注意：建议设为0.0以免跳跃时被攻击（或使用较低值）。
back-up-jump-chance: 0.0

# 谁可以修改村民的物品栏（EVERYONE/FAMILY/PARTNER/NONE）。
# 注意：谨慎设置。
# * 某些玩家可能通过赠送物品提升声望后，从村民处取回物品。
# * 声望越高，折扣越大。
# * 启用下方选项可防止此行为。
who-can-modify-villager-inventory: NONE

# 谁可以修改村民的战斗目标（EVERYONE/FAMILY/PARTNER/NONE）。
who-can-modify-villager-combat: FAMILY

# 谁可以修改村民的家（床）（EVERYONE/FAMILY/PARTNER/NONE）。
who-can-modify-villager-home: FAMILY

# 谁可以使用命名牌修改村民姓名（EVERYONE/FAMILY/PARTNER/NONE）。
# 注意：姓名长度至少3个字符，不可使用颜色。
who-can-modify-villager-name: NONE

# 允许修改村民物品栏时是否禁用特殊价格。
disable-special-prices-if-allowed-to-modify-inventory: true

# 在此可修改近战攻击范围。
# 注意：避免设置超过4的值。
melee-attack-range: 3.375

# 在此可选择村民在附近时是否可乘坐船只。
disable-villager-riding-nearby-boat: false

# 在此可配置村民掠夺箱子的行为。
# 注意：村民从箱子掠夺的物品为上方@default-wanted-items中指定的物品。
loot-chest:
  # 是否启用此行为。
  enabled: true
  # 箱子上必须有的标志行文本，村民才会掠夺。
  # 若希望村民可掠夺任何箱子，留空即可，如：required-sign-line: ""（不推荐）
  required-sign-line: "[Villager]"
  # 若为true，傻子村民掠夺后会随机整理箱子物品。
  nitwit-shuffle-inventory: false
  # 村民再次掠夺箱子的冷却时间（刻）。
  cooldown: 2400
  # 村民掠夺特定箱子的冷却时间（毫秒）。
  # 村民掠夺箱子后，该箱子将进入冷却。
  per-chest-cooldown: 3600000
  # 是否允许婴儿村民掠夺箱子。
  allow-babies: false

# 请求村民跟随所需声望值。
reputation-required-to-ask-to-follow: 20

# 若为true，村民家庭成员可无视@reputation-required-to-ask-to-follow请求跟随。
family-bypass-ask-to-follow: true

# 请求村民停留所需声望值。
reputation-required-to-ask-to-stay: 20

# 若为true，村民家庭成员可无视@reputation-required-to-ask-to-stay请求停留。
family-bypass-ask-to-stay: true

# 婴儿出生时与父亲的初始声望值（必须为父亲）。
# 最小声望值：2；1或更小表示禁用。
initial-reputation-at-birth: 50

# 在此可修改村民生成时的装备。
# @chance：获得物品的概率（0.0到1.0）。未指定则为1.0。
# @only-for-range-weapon：仅当村民获得远程武器时添加到物品栏。
# @only-for-bow：同上，但仅适用于弓。
# @only-for-crossbow：同上，但仅适用于弩。
# @off-hand-if-possible：若可能，添加到副手（仅当副手空闲时）。
spawn-loot:
  # 若为true，已生成的村民也会装备。
  force-equip: false
  equipment:
    hand:
      '1':
        chance: 0.5
        material: BOW
        damage: $RANDOM
      '2':
        chance: 0.625
        material: STONE_SWORD
        damage: $RANDOM
      '3':
        chance: 0.3
        material: IRON_SWORD
        damage: $RANDOM
      '4':
        chance: 0.4
        material: CROSSBOW
        damage: 45%
      '5':
        chance: 0.1
        material: TRIDENT
        damage: $RANDOM
    off-hand:
      '1':
        chance: 0.225
        material: SHIELD
      '2':
        chance: 0.1
        material: TOTEM_OF_UNDYING
    head:
      '1':
        chance: 0.45
        material: LEATHER_HELMET
        enchantments:
          - PROTECTION, 1
          - UNBREAKING, 1-2
        leather-color: $RANDOM
    chest:
      '1':
        chance: 0.4
        material: LEATHER_CHESTPLATE
      '2':
        chance: 0.25
        material: IRON_CHESTPLATE
        enchantments:
          - PROTECTION, 1
      '3':
        chance: 0.01
        material: DIAMOND_CHESTPLATE
        damage: 50%
        enchantments:
          - UNBREAKING, 1-2
    legs:
      '1':
        chance: 0.4
        material: LEATHER_LEGGINGS
        damage: 25%
    feet:
      '1':
        chance: 0.4
        material: LEATHER_BOOTS
        enchantments:
          - PROTECTION
  inventory-items:
    '1':
      chance: 0.4
      material: GOLDEN_APPLE
    '2':
      chance: 0.6
      material: BREAD
      amount: 4-8
    '3':
      material: ARROW
      amount: 16-48
      only-for-range-weapon: true
    '4':
      chance: 0.7
      material: TIPPED_ARROW
      amount: 8-16
      only-for-bow: true
      tipped: $RANDOM
    '5':
      chance: 0.7
      material: FIREWORK_ROCKET
      amount: 6-12
      only-for-crossbow: true
      off-hand-if-possible: true
      firework:
        power: 12-18
        firework-effects:
          '1':
            type: CREEPER
            flicker: true
            trail: true
            colors:
              - RED
              - WHITE
            fade-colors:
              - $RANDOM
    '6':
      chance: 0.3
      material: IRON_INGOT
      amount: 6-9
    '7':
      chance: 0.55
      material: BONE
      amount: 1-3
    '8':
      chance: 0.1
      material: MILK_BUCKET
      amount: 1

# 村民是否可收养被遗弃的宠物（宠物主人（必须为村民）死亡时视为被遗弃）。
villager-adopts-abandoned-pet: true

# 村民弩发射的烟花爆炸是否伤害其他村民。
villager-crossbow-firework-damages-other-villagers: false

# 在此可修改村民的自动问候行为。
greet-messages:
  # 是否启用此行为。
  enabled: true
  # 玩家与村民的距离范围。
  range: 5.0
  # 问候间隔时间（毫秒）。
  cooldown: 60000
  # 玩家可接收的每种问候类型的间隔时间（毫秒）。
  # 类型包括：ADULT, CHILD, CHILD_OFFSPRING, PARTNER。
  per-type-cooldown: 300000
  # 接收村民问候所需声望值。
  required-reputation: 5

# 仅当村民在水中或雨中时投掷三叉戟。
riptide-only-in-water-or-rain: true

# 在此可修改不同移动速度。
# 注意：游泳速度应是这四个中最高的，因为通常比其他速度慢。
speed-modifier:
  eat: 0.25
  walk: 0.5
  sprint: 0.75
  swim: 1.0

# 由于婴儿村民体型较小，看起来比成年村民高；在此设置偏移量使其与成年村民同高。
# 注意1：由于某些原因，1.19.4版本无需偏移，至少在某些Paper构建中如此。
# 注意2：若发现婴儿村民看起来比成年村民高，应将此值设为负数，旧版本中-0.5效果较好。
# 注意3：仅当启用皮肤时需要（@disable-skins = false）。
baby-look-height-offset: 0.0

# 在此可修改村民的日程安排及其活动（无论婴儿或成人）。
# 更多信息见：https://minecraft.fandom.com/wiki/Villager#Schedules
#
# 注意：不了解请不要修改！
# 可用活动：IDLE, PLAY, WORK, MEET, REST。
schedules:
  baby:
    10: IDLE
    3000: PLAY
    6000: IDLE
    10000: PLAY
    12000: REST
  default:
    10: IDLE
    2000: WORK
    9000: MEET
    11000: IDLE
    12000: REST

# 在此可配置村民复活功能。
# 注意：此为实验性功能，未来可能因修复bug或优化而移除。
revive:
  # 村民是否可复活。
  enabled: false
  # 是否仅在夜间复活。
  only-at-night: true
  # 是否仅持有十字架的村民可复活。
  only-with-cross: true
  # 闪电击中时绿宝石块破碎的概率。
  break-emerald-chance: 0.1
  head-item:
    url: SELF
    material: PLAYER_HEAD
    display-name: "&a%villager-name%"
  spawn-values:
    # 生成时的生命值。
    health: 20
    # 生成时的饱食度。
    food-level: 20
    # 生成时应用的药水效果。
    potion-effects:
      - REGENERATION, 900, 2
      - ABSORPTION, 100, 2
      - FIRE_RESISTANCE, 800, 1
  boss-bar:
    # 是否启用Boss栏。
    enabled: true
    # %villager-name%：村民名称。
    title: "%villager-name%"
    # Boss栏进度变化方向（INCREASE/DECREASE）。
    progress-type: INCREASE
    # Boss栏颜色。
    color: RED
    # Boss栏样式。
    style: SOLID
    # Boss栏标志。
    flags:
      - CREATE_FOG
      - DARKEN_SKY

# 若为true，村民可喂养、驯服和骑乘马、驴和骡。
# 注意：此为实验性功能，未来可能因修复bug或优化而移除。
tame-horses: false

# 若为true，婴儿村民的体型将变为成年村民体型，即碰撞箱变大；
# 因此，婴儿村民不再能穿过1x1的孔洞。
# 若为false，婴儿村民碰撞箱缩小（原版效果），但可能出现穿过1x1方块的视觉错误。
# 注意：此选项仅在@disable-skins为false时生效。
increase-baby-scale: true
