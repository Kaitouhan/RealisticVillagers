# 注意：某些选项需要在实体卸载并重新加载到世界后才会生效。
# 建议重启服务器以使更改生效（别偷懒哦 :P）。
#
# 说明：
# 1秒=20刻
# 概率范围从0.0到1.0。
#
# 物品格式：
# @url：纹理使用的URL（@material应为PLAYER_HEAD）。
# @material：物品材质。
# @model-data：自定义模型数据ID，用于自定义资源包。
# @display_name & lore：顾名思义。
# @crafting.shaped：物品配方是否为有序合成（如工作台合成）或无序合成（如燧石与钢）。
# @crafting.ingredients：配方所需材料。格式：MATERIAL_NAME, KEY（用于合成形状，见下文）。
# @crafting.shape：合成表中使用的形状，使用指定的KEY（仅需3行，空格表示空气）。
# @flags：隐藏的属性标志。
# @enchantments：应用的附魔。
# @leather-color：皮革盔甲的颜色。
# * 使用颜色来自：https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Color.html（如AQUA, BLACK等）
# * 使用随机颜色：$RANDOM
# * 使用RGB格式颜色：&#RRGGBB
# @damage：物品承受的伤害值（最大耐久度-给定伤害，可为$RANDOM或X-Y）。
# @tipped：箭的药水效果（必须为TIPPED_ARROW）。
# @amount：物品数量。
#
# 烟花配置：
# @firework.power：烟花的大致威力。每级威力对应半秒飞行时间（0到127）。
# firework-effects：效果列表。
# firework-effects.x.type：效果类型或形状。
# firework-effects.x.flicker：烟花效果是否闪烁。
# firework-effects.x.trail：烟花效果是否有尾迹。
# firework-effects.x.colors：烟花效果的几种主色。
# firework-effects.x.fade-colors：烟花效果的几种渐变色。
# 注意：更多烟花效果（烟花星）=更高伤害。
#
# $RANDOM：
# 颜色：随机颜色（@leather-color / @firework.firework-effects.x.colors/fade-colors）
# 药水类型：随机药水效果（@tipped）
# 烟花效果类型：随机类型或形状（@firework.firework-effects.x.type）
# 对于@damage，使用1到物品最大耐久度的随机值。
#
# 范围值（X-Y）：x到y之间的随机值（@amount / @enchantments等级 / @firework.power）
#
# 百分比（仅适用于@damage，非小数）：X% / %X（必须包含%）；例如：50%（等同于%50）表示半伤害。
# 注意：百分比基于最大耐久度计算；例如：
# * WOODEN_SWORD最大耐久度=60；若@damage为50%（60*0.50）->30。若@damage为25%（60*0.25）->15。
# 该值将作为物品承受的伤害；因此，若@damage为%25，WOODEN_SWORD的新耐久度为60-15=45。
#
# 在此示例中，所需材料为7个GOLD_INGOT和1个DIAMOND。
# 你可以使用空格表示空气（无材料）。
# ingredients:
#   - DIAMOND, D
#   - GOLD_INGOT, G
# shape:
#   - "GDG"
#   - "G G"
#   - "GGG"
#
# 实用链接：
#
# 材质：https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Material.html
# 标志：https://hub.spigotmc.org/javadocs/spigot/org/bukkit/inventory/ItemFlag.html
# 职业：https://hub.spigotmc.org/javadocs/spigot/org/bukkit/entity/Villager.Profession.html
# 附魔：https://www.digminecraft.com/lists/enchantment_list_pc.php
# 颜色：https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Color.html
# 烟花效果类型：https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/FireworkEffect.Type.html
# 效果：https://www.digminecraft.com/lists/effect_list_pc.php

# 请勿触碰此处！
config-version: 6

# 村民渲染距离
render-distance: 56

# 为加快皮肤生成速度，需在mineskin页面创建自己的api密钥。
# 注意：若留空则不使用api密钥，皮肤生成会变慢（不推荐）。
# 注意2：请勿使用微软账户登录，建议使用Minecraft账户以加快请求速度。
# 注意3：请使用谷歌账户登录。若遇问题，尝试清除Cookie并重试。
#
# 创建api密钥步骤：
# * 先访问https://mineskin.org/account。
# * 必须拥有谷歌账户，点击“以X身份继续”。
# * Cloudflare会进行安全连接检查，等待完成。
# * 若页面持续刷新，先访问https://mineskin.org/再执行下一步，此时应已登录。
# * 登录后再次访问https://mineskin.org/account。
# * 在“API Keys”下点击“Manage api keys”。
# * 在“Action”中选择“Create a new API Key”。
# * 定义api密钥名称（任意名称均可）。
# * 向下滚动并点击“Create”按钮。
# * 保存名称、api密钥和密钥密码，避免丢失。
# * 将api密钥粘贴至此并执行/rv reload。
mineskin-api-key: ""

# 若仅希望村民外观像玩家、生成时携带武器并攻击，可禁用所有互动。
disable-interactions: false

# 村民向其他村民分享的最大八卦话题数。
max-gossip-topics: 10

# 这些设置基于玩家声望和是否为村庄英雄。
disable-special-prices: false

# 若玩家佩戴怪物头颅，村民将攻击该玩家。
# 头颅类型：DRAGON_HEAD / WITHER_SKELETON_SKULL / ZOMBIE_HEAD / SKELETON_SKULL / CREEPER_HEAD
attack-player-wearing-monster-skull: true

# 若玩家吹奏山羊角“探寻”音效（与袭击相同），村民将攻击该玩家（1.19+）。
attack-player-playing-goat-horn-seek: true

# 村民听到山羊角的距离（1.19+）。
goat-horn-seek-range: 32

# 村民是否必须保护家庭成员（仅当村民持有武器时）。
villager-defend-family-member: true

# 村民是否必须保护村庄英雄（仅当村民持有武器时）。
# 注意：玩家拥有HERO_OF_THE_VILLAGE效果，或至少击杀一名袭击者并在防御成功后获得该效果时，视为村庄英雄。
villager-defend-hero-of-the-village: true

# 村民是否必须保护正在跟随的玩家（仅当村民持有武器时）。
villager-defend-following-player: true

# 村民是否必须保护玩家免受其他玩家攻击。
# 注意：前三个选项至少需启用一个。
villager-defend-attack-players: false

# 是否禁用玩家姓名标签。
disable-nametags: false

# 在此可修改玩家上方显示的文本。
# 注意：此功能在1.18.2、1.19.4和1.20.1版本中无效 :(.
custom-nametags:
  # 若为true，文本上方会显示代表村民职业方块的小方块（失业和傻子除外）。
  show-job-block: true
  lines:
    # %villager-name%：村民名称。
    # %level%：村民等级（仅适用于@villager）。
    # %profession%：村民职业（仅适用于@villager）。
    villager:
      - "&f%villager-name% &a(等级 %level%)"
      - "&7%profession%"
    wandering-trader:
      - "&d流浪商人"
      - "&f%villager-name%"

skin-preview:
  # 预览持续时间（秒）。
  seconds: 10
  # %remaining%：剩余预览时间。
  message: "预览将在%remaining%秒后结束！"
  # 若为true，消息将带有彩虹效果（类似播放唱片时的自动点唱机效果）。
  rainbow-message: true

# 若为true，村民射出的箭会穿透其他村民。
# 注意：为避免意外互相伤害，建议始终设为true。
arrows-pass-through-other-villagers: true

# 村民射出的箭是否允许拾取（DISALLOWED/ALLOWED/CREATIVE_ONLY）。
arrow-status: ALLOWED

# 近战攻击冷却时间（刻）。
melee-attack-cooldown: 10

# 村民持有铁锭时是否可修复铁傀儡。
villager-fix-iron-golem-with-iron: true

# 再次修复铁傀儡的冷却时间（刻）。0或更小表示无限制。
villager-fix-iron-golem-cooldown: 600

# 村民是否可帮助家庭成员（目前仅玩家）。
villager-help-family: true

# 再次帮助家庭成员的冷却时间（刻）。0或更小表示无限制。
villager-help-family-cooldown: 600

# 村民是否可在需要时生成铁傀儡。
# 注意：默认true，但需考虑村民可自行防御的情况。
villager-spawn-iron-golem: true

# 若玩家在袭击中误击村民，村民是否自卫。
# 注意：若为false，玩家声望不会降低；但若村民死亡，附近村民声望会下降。
villager-attack-player-during-raid: false

# 若玩家在袭击中误击铁傀儡，铁傀儡是否自卫。
iron-golem-attack-player-during-raid: false

# 结婚所需声望值。
reputation-required-to-marry: 75

# 生育所需声望值。
reputation-required-to-procreate: 110

# 在此可允许同性村民生育、家庭成员生育以及村民“出轨”（即已婚村民与其他村民生育）。
#
# 默认所有选项均禁用，否则可能影响村民农场功能。
villager-farm:
  # 若为true，雄性村民可与其他雄性村民生育，雌性同理。
  # 若为false，必须异性村民方可生育。
  ignore-sex-when-procreating: false
  # 若为true，村民可与非配偶村民生育（仅适用于村民间关系）。
  # 若为false，村民仅可与配偶生育（若有配偶）。
  allow-partner-cheating: false
  # 此选项需上方@allow-partner-cheating为true。
  # 若为true，村民可与其他村民生育，即使已与玩家结婚。
  # 若为false，村民仅可与配偶（玩家）生育。
  allow-partner-cheating-for-all: false
  # 若为true，同家族村民可生育（慎启！）。
  # 若为false，同家族村民无法生育（除非是配偶）。
  allow-procreation-between-family-members: false

# 离婚后损失的声望值。最小值：2；1或更小表示禁用。
divorce-reputation-loss: 150

# 使用牧师提供的离婚文件离婚时损失的声望值。最小值：2；1或更小表示禁用。
divorce-reputation-loss-papers: 10

# 变量：
# %sex%：新生儿性别。
input-gui:
  combat-search:
    title: "搜索..."
    text: "搜索..."
  baby:
    title: "是个%sex%宝宝！"
    text: "取名..."
    invalid-name: "无效名称！"
  whistle-search:
    title: "搜索..."
    text: "搜索..."
  skin-search:
    title: "搜索..."
    text: "搜索..."
  new-skin:
    title: "选择玩家？"
    text: "输入..."
  players:
    title: "搜索..."
    text: "搜索..."

# 此设置仅适用于尚未生成的村民。
# 若村民未持有武器，会逃离危险（仅对怪物）。
# 实体列表：https://www.digminecraft.com/lists/entity_list_pc.php
default-target-entities:
  - DROWNED
  - EVOKER
  - HUSK
  - ILLUSIONER
  - PILLAGER
  - RAVAGER
  - VEX
  - VINDICATOR
  - ZOGLIN
  - ZOMBIE
  - ZOMBIE_VILLAGER
  - WARDEN

# 村民探测敌对实体的距离（持有武器的村民探测距离加倍）。
hostile-detection-range: 15.0

# 村民被僵尸击杀时是否变为僵尸村民。
# 治愈后保留所有数据。
zombie-infection: true

# 村民被闪电击中时是否变为女巫。
witch-convertion: true

# 村民用带有引雷附魔的三叉戟攻击时，是否将其他村民变为女巫。
# 注意：@witch-convertion必须为true。
witch-convertion-from-villager-trident: false

# 村民最大生命值。
villager-max-health: 20

# 村民跟随玩家时，若距离超过X是否传送（下方定义）。
teleport-when-following-if-far-away: true

# 若距离超过给定值，村民将被传送。
teleport-when-following-distance: 12

# 村民等待玩家赠送礼物（或床）的时间（刻）。
time-to-expect: 100

# 村民死亡时是否掉落全部物品栏内容。
# 注意：不建议启用，避免玩家通过赠送物品提升声望后回收物品滥用交易折扣。
drop-whole-inventory: false

# 婴儿成长所需时间（毫秒）。
baby-grow-cooldown: 1200000

# 村民再次生育的冷却时间（毫秒）。
procreation-cooldown: 1200000

# 万圣节期间，村民佩戴南瓜/雕刻南瓜的概率。
chance-of-wearing-halloween-mask: 0.25

# 若玩家声望低于X，自动离婚。
divorce-if-reputation-is-less-than: 0

# 村民物品栏大小。
# 允许的最大大小：36。
villager-inventory-size: 27

# 若为false，音效将替换为玩家音效（可能的话）。
use-villager-sounds: false

# 赠送结婚戒指获得的声望值。最小值：2；1或更小表示禁用。
wedding-ring-reputation: 20

# 赠送十字架获得的声望值。最小值：2；1或更小表示禁用。
cross-reputation: 10

# 生育获得的声望值。最小值：2；1或更小表示禁用。
baby-reputation: 20

# 配偶间笑话是否总是成功。
partner-joke-always-success: false

# 与村民互动的成功概率。
chance-of-chat-interaction-success: 0.65

# 每次互动获得的声望值（无论成功与否）。最小值：2；1或更小表示禁用。
chat-interact-reputation: 2

# 每次互动的冷却时间（秒）。
# 注意：@greet & @proud-of总是成功，建议设置合理冷却时间。
# 注意2：@gift的冷却时间从村民拾取礼物后开始。
interact-cooldown:
  chat: 2
  greet: 60
  story: 2
  joke: 2
  flirt: 2
  proud-of: 60
  insult: 2
  divorce-papers: 900
  gift: 5
  bed: 5

# 是否在村民聊天消息中显示头衔。
# 例如，James the Armorer / Juliet the Weaponsmith等。
show-title-in-villager-chat-message: true

# 村民头衔名称中的冠词。
# 其他语言可按性别指定不同冠词。
villager-title-article:
  male: "the"
  female: "the"

# 村民聊天消息格式。
villager-message-format: "%name%: %message%"

