      - "呃...我看到你手上的戒指了，你已经结婚了！"
      - "你到底想干嘛？你自己已经有配偶了！"
      - "啥？真的吗？你是不是已经和别人结婚了？"
      - "太过分了！你居然已经有伴侣了！"
