      - "啥？不行！我不喜欢你！"
      - "戒指挺漂亮！等等...是给我的？嗯...还是算了。"
      - "是给我的吗？抱歉，我还不太了解你。"
      - "谢谢夸奖，但我真的不太认识你。"
