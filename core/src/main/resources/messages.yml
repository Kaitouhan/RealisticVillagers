      - "抱歉，我...我已经结婚了。"
      - "哦，我以为你知道...我已经和别人结婚了。"
      - "啥？！我已经结婚了！"
      - "我已经有配偶了。"
      - "我婚姻很幸福，不想再找别的伴侣。"
      - "我不想要这个，我已经结婚了。"
      - "我已经有配偶了，不能收这个戒指。"
      - "谢谢好意啦，不过我已经和别人结婚了。"
