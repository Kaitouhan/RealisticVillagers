# 重要提示：所有消息必须用引号括起来（单引号'测试'或双引号"测试"），否则消息会丢失，文件将重置为0。
# 每次修改此文件时，请先保存副本，然后再重新加载插件，以免丢失数据并不得不重新开始。

# 请勿触碰此处！
config-version: 1

# 以下占位符可用于村民发送给玩家的几乎所有消息（礼物/聊天/笑话等）。
# %player-name% - 接收消息的玩家名称。
# %random-player-name% - 服务器上玩过的随机玩家名称。
# %villager-name% - 参与对话的村民名称。
# %random-villager-name% - 附近随机村民的名称。

